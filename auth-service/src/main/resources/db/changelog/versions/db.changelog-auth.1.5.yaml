databaseChangeLog:
  - changeSet:
      id: "auth-1.5"
      author: Yevgany Tyurin
      changes:

        - createTable:
            tableName: registration_tokens
            columns:
              - column:
                  name: salt
                  type: VARCHAR(255)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: token
                  type: VARCHAR(255)
                  constraints:
                    nullable: false