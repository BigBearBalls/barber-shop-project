databaseChangeLog:
  - changeSet:
      id: "auth-1.0"
      author: Artsem Yushkevich
      changes:
        - createTable:
            schemaName: auth_service_schema
            tableName: permission
            columns:
              - column:
                  name: permission_id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: permission_value
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true

        - createTable:
            tableName: users
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

        - createTable:
            schemaName: auth_service_schema
            tableName: user_permission
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: permission_id
                  type: INT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: auth_service_schema
            tableName: user_permission
            columnNames: user_id, permission_id
            constraintName: pk_user_permission

        - addForeignKeyConstraint:
            baseTableSchemaName: auth_service_schema
            baseTableName: user_permission
            baseColumnNames: user_id
            referencedTableSchemaName: auth_service_schema
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_user_permission_user_id

        - addForeignKeyConstraint:
            baseTableSchemaName: auth_service_schema
            baseTableName: user_permission
            baseColumnNames: permission_id
            referencedTableSchemaName: auth_service_schema
            referencedTableName: permission
            referencedColumnNames: permission_id
            constraintName: fk_user_permission_permission_id

        - addUniqueConstraint:
            schemaName: auth_service_schema
            tableName: user_permission
            columnNames: user_id, permission_id
            constraintName: uq_user_permission

        - createIndex:
            schemaName: auth_service_schema
            tableName: user_permission
            indexName: idx_user_permission_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            schemaName: auth_service_schema
            tableName: user_permission
            indexName: idx_user_permission_permission_id
            columns:
              - column:
                  name: permission_id