databaseChangeLog:
  - changeSet:
      id: "auth-1.0"
      author: Artsem Yushkevich
      changes:
        - createTable:
            schemaName: auth_service_schema
            tableName: role
            columns:
              - column:
                  name: role_id
                  type: SMALLINT
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: role_value
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

        - createTable:
            tableName: users
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: role_id
                  type: SMALLINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: role_id
            constraintName: fk_user_role
            referencedTableName: role
            referencedColumnNames: role_id
