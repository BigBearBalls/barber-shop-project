  user-service:
    build: ./user-service
    healthcheck:
      test: curl -f http://localhost:8080/actuator/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    env_file:
      - env/datasource.env
      - env/security.env
    depends_on:
      plahctoh-database:
        condition: service_healthy
    networks:
