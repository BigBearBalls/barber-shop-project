  plahctoh-database:
    image: postgres:14.7-alpine
    env_file:
      - env/datasource.env
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", "plahctoh-database" ]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - "./db/init-scripts:/docker-entrypoint-initdb.d/"
      - local_pgdata:/var/lib/postgresql/data
    networks:
      - plahctoh

  pgadmin-ui:
    image: dpage/pgadmin4
    restart: always
    depends_on:
      plahctoh-database:
        condition: service_healthy
    ports:
      - "5051:80"
    env_file:
      - env/datasource.env
    networks:
      - plahctoh
    volumes:
      - pgadmin_data:/var/lib/pgadmin

