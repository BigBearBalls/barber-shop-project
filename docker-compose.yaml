  department-service:
    build: ./department-service
    healthcheck:
      test: curl -f http://localhost:8080/actuator/health
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    env_file:
      - env/security.env
      - env/datasource.env
    depends_on:
      plahctoh-database:
        condition: service_healthy
    networks:
      - plahctoh

  gateway-service:
    build: ./gateway-service
    ports:
