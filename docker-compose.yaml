    healthcheck:
      test: curl -f http://localhost:8080/actuator/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always
    env_file:
      - env/feign-services-url.env
      - env/security.env
      - env/keycloak.env
    networks:
      - plahctoh

