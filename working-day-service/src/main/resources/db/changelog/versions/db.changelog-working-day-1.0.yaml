databaseChangeLog:
  - changeSet:
      id: working-day-table
      author: Yevgany Tyurin
      changes:
        - createTable:
            schemaName: working_day_service_schema
            tableName: working_days
            columns:
              - column:
                  name: working_day_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: master_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: working_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: work_start
                  type: TIME
                  constraints:
                    nullable: false

              - column:
                  name: work_end
                  type: TIME
                  constraints:
                    nullable: false
