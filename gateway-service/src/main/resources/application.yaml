spring:
  application:
    name: gateway-service
    #  security:
    #    oauth2:
    #      resourceserver:
    #        jwt:
    #          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8082/realms/plahctoh-realm}
    #          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8082/realms/plahctoh-realm/protocol/openid-connect/certs}
    security:
      jwt:
        access-key:
          expiration-time: 10
        refresh-key:
          expiration-time: 120
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service-route
            uri: http://auth-service:8080
            predicates:
              - Path=/api/v1/auth/**, /api/v1/permissions/**
            filters:
              - AddRequestHeader=X-Request-Api-Key, ${API_KEY}
              - AddRequestHeader=X-Request-Source, EXTERNAL

          - id: booking-service-route
            uri: http://booking-service:8080
            predicates:
              - Path=/api/v1/bookings/**
            filters:
              - AddRequestHeader=X-Request-Api-Key, ${API_KEY}
              - AddRequestHeader=X-Request-Source, EXTERNAL

          - id: calendar-service
            uri: http://calendar-service:8080
            predicates:
              - Path=/api/v1/calendars/**
            filters:
              - AddRequestHeader=X-Request-Api-Key, ${API_KEY}
              - AddRequestHeader=X-Request-Source, EXTERNAL

          - id: user-service
            uri: http://user-service:8080
            predicates:
              - Path=/api/v1/user/**
            filters:
              - AddRequestHeader=X-Request-Api-Key, ${API_KEY}
              - AddRequestHeader=X-Request-Source, EXTERNAL

          - id: account-service
            uri: http://account-service:8080
            predicates:
              - Path=/api/v1/account/**
            filters:
              - AddRequestHeader=X-Request-Api-Key, ${API_KEY}
              - AddRequestHeader=X-Request-Source, EXTERNAL

#jwt:
#  auth:
#    converter:
#      resource-id: plahctoh-realm

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

feign:
  clients:
    auth-service:
      url: ${AUTH_SERVICE_URL}

http-configuration:
  security:
    filters:
      get-user-id-header-filter:
        enable: false
      api-key-header-filter:
        enable: false

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

