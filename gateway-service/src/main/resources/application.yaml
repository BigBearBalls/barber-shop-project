spring:
  application:
    name: gateway-service
  #  security:
  #    oauth2:
  #      resourceserver:
  #        jwt:
  #          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8082/realms/barbershop-realm}
  #          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8082/realms/barbershop-realm/protocol/openid-connect/certs}
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service-route
            uri: http://auth-service:8080
            predicates:
              - Path=/api/v1/auth/**
            filters:
              - AddRequestHeader=X-Request-Api-Key, ${API_KEY}
              - AddRequestHeader=X-Request-Source, EXTERNAL

          - id: booking-service-route
            uri: http://booking-service:8080
            predicates:
              - Path=/api/v1/booking/**
            filters:
              - AddRequestHeader=X-Request-Api-Key, ${API_KEY}
              - AddRequestHeader=X-Request-Source, EXTERNAL

          - id: procedure-service
            uri: http://procedure-service:8080
            predicates:
              - Path=/api/v1/procedure/**
            filters:
              - AddRequestHeader=X-Request-Api-Key, ${API_KEY}
              - AddRequestHeader=X-Request-Source, EXTERNAL

          - id: user-service
            uri: http://user-service:8080
            predicates:
              - Path=/api/v1/user/**
            filters:
              - AddRequestHeader=X-Request-Api-Key, ${API_KEY}
              - AddRequestHeader=X-Request-Source, EXTERNAL

#jwt:
