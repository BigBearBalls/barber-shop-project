databaseChangeLog:
  - changeSet:
      id: "reservation-1.0"
      author: Yevgany Tyurin
      changes:
        - createTable:
            schemaName: meeting_room_service_schema
            tableName: reservations
            columns:
              - column:
                  name: reservation_id
                  type: uuid
                  autoIncrement: false
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: meeting_room_id
                  type: uuid
                  constraints:
                    unique: false
                    nullable: false

              - column:
                  name: reservation_date
                  type: DATE
                  constraints:
                    unique: false
                    nullable: false

              - column:
                  name: reservation_start_time
                  type: TIME
                  constraints:
                    unique: false
                    nullable: false

              - column:
                  name: reservation_end_time
                  type: TIME
                  constraints:
                    unique: false
                    nullable: false

              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    unique: false
                    nullable: false