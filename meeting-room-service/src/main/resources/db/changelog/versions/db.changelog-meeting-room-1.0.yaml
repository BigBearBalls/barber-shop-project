databaseChangeLog:
  - changeSet:
      id: "meeting-room-1.0"
      author: Yevgany Tyurin
      changes:
        - createTable:
            schemaName: meeting_room_service_schema
            tableName: meeting_rooms
            columns:
              - column:
                  name: meeting_room_id
                  type: uuid
                  autoIncrement: false
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: number
                  type: BIGINT
                  constraints:
                    nullable: false
