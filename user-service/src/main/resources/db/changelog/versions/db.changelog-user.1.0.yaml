databaseChangeLog:
  - changeSet:
      id: "user-1.0"
      author: Artsem Yushkevich
      changes:
        - createTable:
            schemaName: user_service_schema
            tableName: users
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: first_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: phone_number
                  type: VARCHAR(25)
                  constraints:
                    nullable: false
                    unique: true