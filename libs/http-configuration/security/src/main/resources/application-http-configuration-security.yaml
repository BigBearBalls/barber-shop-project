http-configuration:
  security:
    filters:
      enable: true
      get-user-header-filter:
        enable: true
      api-key-header-filter:
        enable: true
    feign:
      enable: true
      interceptor:
        add-user-to-headers:
          enable: true
spring:
  application:
    security:
      api-key: ${API_KEY}
