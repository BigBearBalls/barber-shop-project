<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<div id="addStudentModal" class="modal fade" role="dialog" th:fragment="add-procedure" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary">
                <h4 class="modal-title"><span style="font-weight:bold">Add Procedure</span></h4>
            </div>

            <form th:action="@{/add-procedure}" method="post" th:object="${procedure}" id="add-student-form">

                <div class="modal-body">
                    <div class="form-group">
                        <label >Name</label>
                        <input type="text" th:field="*{procedureName}" name="Name" class="form-control" required="" oninvalid="this.setCustomValidity('Name can not be empty')" oninput="setCustomValidity('')"/>
                    </div>

                    <div class="form-group">
                        <label >Price</label>
                        <input type="text" th:field="*{procedurePrice}" name="Price" class="form-control" required="" oninvalid="this.setCustomValidity('Price can not be empty')" oninput="setCustomValidity('')"/>
                    </div>

                    <div class="form-group">
                        <label >Duration</label>
                        <input type="text" th:field="*{procedureDuration}" name="duration" class="form-control" required="" oninvalid="this.setCustomValidity('Duration can not be empty')" oninput="setCustomValidity('')"/>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>

            </form>
        </div>
    </div>
</div>
</html>
