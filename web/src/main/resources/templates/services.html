<!DOCTYPE html>
<html style="font-size: 16px;" lang="en"><head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <meta name="keywords" content="Responsive Table">
    <meta name="description" content="">
    <title>Services</title>

    <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.js"></script>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.9.2/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/ui/1.9.2/jquery-ui.js"></script>

    <script type="text/javascript">

        function addProcedure(){
            $.ajax({
                url: "/add-procedure",
                success: function(data){
                    $("#addStudentModalHolder").html(data);
                    $('#addStudentModal').modal({
                        backdrop: 'static'
                    });
                }
            });
        }

        function assignMasterProcedure(id){
            $.ajax({
                url: "/assign-master-procedure/" + id,
                success: function(data){
                    $("#deleteStudentModalHolder").html(data);
                    $('#deleteStudentModal').modal({
                        backdrop: 'static'
                    });

                }
            });
        }

    </script>

    <link rel="stylesheet" type="text/css" th:href="@{/css/nicepage-services.css}" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/index-services.css}" />

    <script class="u-script" type="text/javascript" th:href="@{/js/nicepage-services.js}" defer=""></script>
    <meta name="generator" content="Nicepage 7.0.5, nicepage.com">
    <link id="u-theme-google-font" rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:100,100i,300,300i,400,400i,500,500i,700,700i,900,900i|Open+Sans:300,300i,400,400i,500,500i,600,600i,700,700i,800,800i">
    <link id="u-page-google-font" rel="stylesheet" href="https://fonts.googleapis.com/css?family=Playfair+Display:400,400i,500,500i,600,600i,700,700i,800,800i,900,900i">

    <meta name="theme-color" content="#478ac9">
    <meta property="og:title" content="Page 2">
    <meta property="og:type" content="website">
    <meta data-intl-tel-input-cdn-path="intlTelInput/"></head>
<body data-home-page="https://website6400188.nicepage.io/Page-2.html?version=9416add8-9ea5-7489-f796-172e06bad374" data-home-page-title="Page 2" data-path-to-root="./" data-include-products="false" class="u-body u-xl-mode" data-lang="en">
<section class="u-align-center u-clearfix u-container-align-center u-palette-5-base u-section-1" id="sec-caca">
    <div class="u-clearfix u-sheet u-valign-middle u-sheet-1">
        <h2 class="u-custom-font u-font-playfair-display u-text u-text-1">Barbershop services</h2>
        <div class="u-expanded-width u-table u-table-responsive u-table-1">

            <div >
                <a href="#" th:onclick="'javascript:addProcedure();'">
                    <button> Add New Service</button>
                </a>
                <p></p>
            </div>

            <div th:if="${procedures.size() > 0}">
                <table class="u-table-entity u-table-entity-1">
                    <thead class="u-palette-5-dark-2 u-table-header u-table-header-1">
                    <tr>
                        <th scope="col" class="u-border-2 u-border-no-left u-border-no-right u-border-no-top u-border-palette-5-dark-1 u-table-cell">Name</th>
                        <th scope="col" class="u-border-2 u-border-no-left u-border-no-right u-border-no-top u-border-palette-5-dark-1 u-table-cell">Price</th>
                        <th scope="col" class="u-border-2 u-border-no-left u-border-no-right u-border-no-top u-border-palette-5-dark-1 u-table-cell">Duration</th>
                        <th scope="col" class="u-border-2 u-border-no-left u-border-no-right u-border-no-top u-border-palette-5-dark-1 u-table-cell">Assign</th>
                    </tr>
                    </thead>
                    <tbody class="u-palette-5-dark-3 u-table-body u-table-body-1">
                    <tr th:each="procedure : ${procedures}">

                        <td class="u-border-1 u-border-palette-5-dark-1 u-table-cell u-table-cell-5">[[${procedure.procedureName}]]</td>
                        <td class="u-border-1 u-border-palette-5-dark-1 u-table-cell u-table-cell-5">[[${procedure.procedurePrice}]]</td>
                        <td class="u-border-1 u-border-palette-5-dark-1 u-table-cell u-table-cell-5">[[${procedure.duration}]]</td>

                        <td>
                            <button th:data-id="${procedure.id}" class="btn btn-success btn-xs"
                                    onclick="assignMasterProcedure(this.getAttribute('data-id'))" type="button"><span class="glyphicon glyphicon-pencil"></span>
                            </button>
                        </td>

                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<div th:fragment="add-student" id="addStudentModalHolder"></div>
<div th:fragment="assign-master-procedure" id="deleteStudentModalHolder"></div>
</body></html>
