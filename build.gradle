plugins {
    id "checkstyle"
    id "java"
    id 'java-library'
    id "org.springframework.boot" version '3.3.5'
    id "io.spring.dependency-management" version '1.1.6'
}

bootJar {
    enabled = false
}

def DEPARTMENT_SERVICE = project(":department-service")
def BOOKING_SERVICE = project(":booking-service")
def USER_SERVICE = project(":user-service")
def GATEWAY_SERVICE = project(":gateway-service")
def NOTIFICATION_SERVICE = project(":notification-service")
def CALENDAR_SERVICE = project(":calendar-service")
def AUTH_SERVICE = project(":auth-service")

allprojects {
    group "eu.senla"
    version "0.0.1-SNAPSHOT"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    repositories {
        mavenCentral()
    }
}

ext {
    set("springCloudVersion", "2023.0.3")
    set("springSecurityOauth2Version", "6.3.4")
    set("validationApiVersion", "3.0.2")
    set("mapstructVersion", "1.5.5.Final")
    set("jwtVersion", "0.11.5")
    set("testContainersVersion", "1.18.3")
    set("junitJupiterVersion", "5.10.0")
    set("mockitoCoreVersion", "5.4.0")
    set("tcJupiterVersion", "1.19.0")
}


Set<Project> kafkaProjects = Set.of(NOTIFICATION_SERVICE, BOOKING_SERVICE, CALENDAR_SERVICE, AUTH_SERVICE)
Set<Project> datasourceProjects = Set.of(BOOKING_SERVICE, USER_SERVICE, CALENDAR_SERVICE, AUTH_SERVICE, DEPARTMENT_SERVICE)
Set<Project> webProjects = Set.of(BOOKING_SERVICE, USER_SERVICE, NOTIFICATION_SERVICE,
        CALENDAR_SERVICE, AUTH_SERVICE, GATEWAY_SERVICE, DEPARTMENT_SERVICE)
Set<Project> securityProjects = Set.of(/*BOOKING_SERVICE, PROCEDURE_SERVICE, USER_SERVICE, */ GATEWAY_SERVICE)

bootJar {
    enabled = false
}

subprojects { subproject ->

    apply {
        plugin("java")
        plugin("org.springframework.boot")
        plugin("io.spring.dependency-management")
        plugin("checkstyle")
    }

    bootJar {
        archivesBaseName = "app"
    }

    if (subproject in datasourceProjects) {
        dependencies {
            implementation "org.liquibase:liquibase-core"
            implementation "org.springframework.boot:spring-boot-starter-data-jpa"
            runtimeOnly "org.postgresql:postgresql"
        }
    }

    if (subproject in webProjects) {
        dependencies {
            implementation project(':libs.http-configuration.security')
            implementation project(':libs.http-configuration.core')
            implementation "org.springframework.boot:spring-boot-starter-web"
            implementation "org.springframework.cloud:spring-cloud-starter-openfeign"
            implementation "org.springframework.boot:spring-boot-starter-validation"
            testImplementation 'org.springframework.boot:spring-boot-starter-test'
            testImplementation "org.testcontainers:postgresql:${testContainersVersion}"
            testImplementation "org.testcontainers:junit-jupiter:${tcJupiterVersion}"
            testImplementation "org.junit.jupiter:junit-jupiter:${junitJupiterVersion}"
            testImplementation "org.mockito:mockito-core:${mockitoCoreVersion}"
        }
    }

    if (subproject in kafkaProjects) {
        dependencies {
            implementation "org.springframework.kafka:spring-kafka"
            implementation 'org.springframework.boot:spring-boot-starter-mail'
//            testImplementation "org.springframework.kafka:spring-kafka-test"
        }
    }

    if (subproject in securityProjects) {
        dependencies {
            implementation "org.springframework.boot:spring-boot-starter-security"
            implementation "org.springframework.security:spring-security-oauth2-resource-server:${springSecurityOauth2Version}"
            implementation "org.springframework.security:spring-security-oauth2-jose:${springSecurityOauth2Version}"
            implementation "org.springframework.security:spring-security-oauth2-client:${springSecurityOauth2Version}"
            testImplementation 'org.springframework.security:spring-security-test'
        }
    }

    if (!subproject.path.startsWith(':libs')) {
        dependencies {
            implementation "org.mapstruct:mapstruct:${mapstructVersion}"
            implementation project(":libs.common")
            implementation "org.springframework.boot:spring-boot-starter-actuator"
        }
    } else {
        apply {
            plugin('java-library')
        }
        bootJar {
            enabled = false
            archivesBaseName = subproject.name
        }
        dependencies {
            if (!subproject.path.equals(":libs.common")) {
                implementation project(":libs.common")
            }

            implementation "org.springframework.boot:spring-boot-starter-validation"
            implementation "org.springframework.boot:spring-boot-starter-web"
        }
    }

    dependencies {
        compileOnly "org.projectlombok:lombok"
        testImplementation "org.springframework.boot:spring-boot-starter-test"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
        developmentOnly "org.springframework.boot:spring-boot-devtools"
        implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'
    }

    tasks.named("test") {
        useJUnitPlatform()
    }

    checkstyle {
        toolVersion = "10.20.0"
        configFile = file("${rootDir}/checkstyle.xml")
    }

    checkstyleMain {
        source = "src/main/java"
    }
    checkstyleTest {
        source = "src/test/java"
    }

    tasks.withType(Checkstyle).configureEach {
        reports {
            xml.required = false
            html.required = true
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }
}