databaseChangeLog:
  - changeSet:
      id: "booking-1.0"
      author: Dany
      changes:
        - createTable:
            schemaName: booking_service_schema
            tableName: bookings
            columns:
              - column:
                  name: booking_id
                  type: uuid
                  autoIncrement: false
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: reservation_start
                  type: TIME
                  constraints:
                    nullable: false

              - column:
                  name: reservation_end
                  type: TIME
                  constraints:
                    nullable: false