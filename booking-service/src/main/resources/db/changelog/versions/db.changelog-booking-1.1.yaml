databaseChangeLog:
  - changeSet:
      id: "booking-1.2"
      author: Dany
      changes:
        - addColumn:
            schemaName: booking_service_schema
            tableName: bookings
            columns:
              - column:
                  name: procedure_id
                  type: uuid
                  constraints:
                    nullable: true

              - column:
                  name: working_day_id
                  type: uuid
                  constraints:
                    nullable: true

              - column:
                  name: client_id
                  type: UUID
                  constraints:
                    nullable: true