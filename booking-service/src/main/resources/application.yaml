spring:
  application:
    name: booking-service
    security:
      jwt:
        access-key:
          value: ${ACCESS_KEY}
          expiration-time: 10
        refresh-key:
          value: ${REFRESH_KEY}
          expiration-time: 120
      api-key: ${API_KEY}

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-booking-master.yaml
    enabled: true
    default-schema: "booking_service_schema"
  datasource:
    username: ${DATABASE_USERNAME:admin}
    password: ${DATABASE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/}${DATABASE_NAME:barber-shop-database}
  jpa:
    hibernate:
      ddl-auto: none
    database: postgresql
    properties:
      hibernate:
        show_sql: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

feign:
  clients:
    user-service:
      url: ${USER_SERVICE_URL}/api/v1/user
    calendar-service:
      url: ${CALENDAR_SERVICE_URL}/api/v1/calendar
